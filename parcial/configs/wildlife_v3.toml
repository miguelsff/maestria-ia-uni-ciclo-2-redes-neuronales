[paths]
kaggle_root = "E:/Kaggle"

[training]
seed = 42
epochs = 50
patience = 10
workers = 4
device = "cuda"
amp = true
learning_rate = 0.0003
weight_decay = 0.0001

[mri]
max_studies = 600
validation_fraction = 0.2
image_size = 224
stacks = 8
batch_size = 4
threshold = 0.5
confidence_threshold = 0.8
focal_gamma = 2.0
architectures = ["scratch", "resnet50"]
losses = ["bce", "focal"]
noise_strategies = ["weighted", "high_confidence"]

[flood]
batch_size = 4
base_channels = 32
threshold = 0.5
weak_weight = 0.3
weak_max = 4385
supervision = ["gold", "gold_weak"]
losses = ["bce", "dice", "combined"]

[wildlife]
expected_classes = 14
model = "yolov8s.pt"
batch_size = 16
image_size = 640
confidence = 0.25
nms_iou = 0.7
cam_layer = 9
bbox_units = "pixels"
occlusion_min_examples = 30
prediction_batch = 8
background_manifest = "/datasets/cct-backgrounds/cohort.json"
require_training_backgrounds = true
occlusion_review_mode = "full"

annotation_corrections = "/workspace/configs/wildlife_label_corrections.json"
review_parent = "/outputs/inputs/parent-v2"
require_label_evidence = true
require_architecture_evidence = true
resume_preserve_patience = true
uncertainty_replicates = 200
