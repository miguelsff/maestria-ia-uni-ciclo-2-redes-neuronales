[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-exam"
version = "0.1.0"
description = "Local knee MRI, Sentinel-1 flood and camera-trap experiments"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[project.scripts]
neural-exam = "neural_exam.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: CPU training and checkpoint integration checks"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
